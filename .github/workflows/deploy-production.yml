# Production: every push to master builds the site with OpenNext and deploys
# it to the "almajdouie" Worker in the Cloudflare account that owns the
# almajdouie.org zone (Mhwari@gmail.com's Account), so the Worker can serve the
# domain directly. main is staging and deploys to Vercel on its own.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN           "Edit Cloudflare Workers" token for that account
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  inlined into the build
#   NEXT_PUBLIC_MAPTILER_KEY       inlined into the build
#   SUPABASE_SERVICE_ROLE_KEY      runtime secret on the Worker
name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Off until the Mhwari account owner provides a token: production stays on
    # Vercel until then. Turn on with the repository variable
    # DEPLOY_TO_CLOUDFLARE=true (Settings → Secrets and variables → Actions →
    # Variables) once the CLOUDFLARE_API_TOKEN secret exists.
    if: vars.DEPLOY_TO_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: my-app
    env:
      CLOUDFLARE_ACCOUNT_ID: 1aa22704112a0ba2b9086d127ef7d637
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://www.almajdouie.org
      NEXT_PUBLIC_SUPABASE_URL: https://ibcnfufiyrnkfgxjkanr.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: my-app/.node-version
          cache: pnpm
          cache-dependency-path: my-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy
        run: pnpm exec opennextjs-cloudflare deploy

      # Re-applied on every deploy so the Worker never runs without it. Piped
      # through stdin so the value never appears in the command line or log.
      - name: Set runtime secret
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY
